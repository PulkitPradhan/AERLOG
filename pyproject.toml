[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "aerlog"
version = "0.1.0"
description = "Local-first MCP execution recorder, diagnostic workbench, and replay harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pulkit Pradhan" }]
keywords = ["mcp", "json-rpc", "debugging", "replay", "observability", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "rich>=13.9,<16",
    "typer>=0.16,<1",
]

[project.scripts]
aerlog = "aerlog.cli.app:main"

[dependency-groups]
dev = [
    "mcp>=2.3,<3",
    "mypy>=1.14,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aerlog"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/aerlog",
    "tests",
    "examples/quickstart_server.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["examples/protocol-spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
exclude = ["^examples/protocol-spike/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
